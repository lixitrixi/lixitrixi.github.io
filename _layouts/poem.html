<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>
      {{ page.title }}
      •
      {{ site.title }}
    </title>
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
    <link rel="icon" href="{{ "/assets/img/favicon.png" | relative_url }}" type="image/png">
    {% include analytics.html %}
    <script src="{{ "/assets/js/main.js" | relative_url }}" defer></script>
  </head>
  <body class="flex flex-col min-h-screen" style="background: {{ page.background | default: "white" }}">
    <main class="m-auto p-4 {{ page.content-class }}">{{ content }}</main>
  </body>
</html>
